name: Update War Thunder radar

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Download website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official War Thunder news
        run: python scripts/update_war_thunder_news.py

      - name: Save updated radar
        run: |
          if git diff --quiet -- data/war-thunder-news.json data/war-thunder-news.js; then
            echo "No changes."
            exit 0
          fi
          git config user.name "daily-thunder-bot"
          git config user.email "daily-thunder-bot@users.noreply.github.com"
          git add data/war-thunder-news.json data/war-thunder-news.js
          git commit -m "Update War Thunder radar"
          git push
